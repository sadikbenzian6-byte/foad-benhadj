<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة FOAD BENHADJ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17212b;font-family:Tahoma,Arial}header{background:#17212b;color:white;padding:20px 5%}main{max-width:1000px;margin:25px auto;padding:0 15px}.panel{background:white;border:1px solid #e0e6eb;border-radius:14px;padding:18px;margin-bottom:16px}input,textarea,select{width:100%;padding:10px;border:1px solid #ccd5de;border-radius:8px;font:inherit;margin:5px 0 10px}button{border:0;border-radius:9px;padding:10px 14px;background:#d97706;color:white;font-weight:bold;cursor:pointer}.secondary{background:#e7edf2;color:#17212b}.danger{background:#b42318}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.notice{background:#fff1d6;padding:10px;margin:10px 0;display:none}.hidden{display:none!important}.muted{color:#687582}.order{border:1px solid #e0e6eb;padding:12px;border-radius:10px;margin:10px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}td,th{text-align:right;padding:10px;border-bottom:1px solid #e0e6eb}img{width:55px;height:45px;object-fit:cover}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header><h2>FOAD BENHADJ — لوحة المدير</h2></header><main><div id="notice" class="notice"></div><section id="login" class="panel" style="max-width:450px;margin:30px auto"><h2>تسجيل دخول المدير</h2><form id="loginForm"><label>البريد الإلكتروني</label><input id="email" type="email" required><label>كلمة المرور</label><input id="password" type="password" required><button style="width:100%">دخول</button></form></section><div id="dash" class="hidden"><div class="row" style="justify-content:space-between"><h2>إدارة المنتجات والطلبات</h2><button class="secondary" id="logout">تسجيل الخروج</button></div><section class="panel"><h3 id="formTitle">إضافة منتج</h3><form id="productForm" class="grid"><div class="full"><label>اسم السلعة</label><input id="name" required></div><div><label>سعر السلعة (دج)</label><input id="price" type="number" min="0" required></div><div><label>سعر التركيب (دج)</label><input id="install" type="number" min="0" required></div><div class="full"><label>الوصف</label><textarea id="description"></textarea></div><div class="full"><label>صورة السلعة</label><input id="image" type="file" accept="image/*"></div><div class="full row"><button id="save">حفظ المنتج</button><button type="button" class="secondary hidden" id="cancel">إلغاء</button></div></form></section><section class="panel"><h3>المنتجات</h3><div class="scroll"><table><thead><tr><th>صورة</th><th>الاسم</th><th>السعر</th><th>التركيب</th><th>إجراءات</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel"><h3>طلبات الزبائن</h3><div id="orders">جارٍ التحميل...</div></section></div></main>
<script>
(async function bootstrapSite(){
  function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('تعذر تحميل ملف: '+src));document.head.appendChild(s);});}
  if(!window.supabase){try{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js');}catch(firstError){await loadScript('https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js');}}
  window.SUPABASE_URL = "https://pbhqyfkqmdbquuzvqtod.supabase.co";
  window.SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5OrQVUhsStQUxFKUC5e2vg_3fcwOq2z";

const $=id=>document.getElementById(id);
if (!window.supabase || !window.SUPABASE_URL || !window.SUPABASE_PUBLISHABLE_KEY) {
  note('تعذر تحميل إعدادات الاتصال. حدّث الصفحة أو تواصل مع الإدارة.');
  throw new Error('Supabase library failed to load');
}
const db = window.supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_PUBLISHABLE_KEY
);
let products=[],editing=null;
const money=n=>Number(n||0).toLocaleString('fr-FR')+' دج';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(t){$('notice').textContent=t;$('notice').style.display='block'}
async function verify(){
  const {data,error}=await db.rpc('is_site_admin');
  if(error){
    await db.auth.signOut();
    note('تعذر التحقق من صلاحية المدير: ' + error.message);
    return false;
  }
  if(data!==true){
    await db.auth.signOut();
    note('هذا الحساب ليس حساب المدير المعتمد.');
    return false;
  }
  return true;
}
async function openDash(){if(!await verify())return;$('login').classList.add('hidden');$('dash').classList.remove('hidden');await Promise.all([loadProducts(),loadOrders()])}
$('loginForm').onsubmit=async e=>{
  e.preventDefault();
  const button=e.target.querySelector('button[type="submit"],button:not([type])');
  if(button) button.disabled=true;
  try {
    const {error}=await db.auth.signInWithPassword({
      email:$('email').value.trim(),
      password:$('password').value
    });
    if(error) throw error;
    await openDash();
  } catch(error) {
    note('تعذر تسجيل الدخول: ' + (error.message || 'تحقق من الاتصال وبيانات الدخول.'));
  } finally {
    if(button) button.disabled=false;
  }
};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
async function loadProducts(){let {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error){note(error.message);return}products=data||[];$('rows').innerHTML=products.map(p=>`<tr><td>${p.image_url?`<img src="${esc(p.image_url)}">`:'—'}</td><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${money(p.install_price)}</td><td><div class="row"><button class="secondary" onclick="editProduct('${p.id}')">تعديل</button><button class="danger" onclick="deleteProduct('${p.id}')">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="5">لا توجد منتجات</td></tr>'}
async function upload(file){if(!file)return null;if(file.size>3*1024*1024)throw Error('الصورة أكبر من 3 ميغابايت');if(!file.type.startsWith('image/'))throw Error('الملف ليس صورة');let ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'');let token;
if (window.crypto && typeof window.crypto.randomUUID === 'function') {
  token = window.crypto.randomUUID();
} else {
  const bytes = new Uint8Array(16);
  window.crypto.getRandomValues(bytes);
  token = Array.from(bytes, b => b.toString(16).padStart(2,'0')).join('');
}
let path=token+'.'+ext;let {error}=await db.storage.from('product-images').upload(path,file,{contentType:file.type});if(error)throw error;return db.storage.from('product-images').getPublicUrl(path).data.publicUrl}
$('productForm').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{let image_url=editing?.image_url||null;if($('image').files[0])image_url=await upload($('image').files[0]);let record={name:$('name').value.trim(),price:Number($('price').value),install_price:Number($('install').value),description:$('description').value.trim(),image_url};let result=editing?await db.from('products').update(record).eq('id',editing.id):await db.from('products').insert(record);if(result.error)throw result.error;reset();await loadProducts();note('تم حفظ المنتج.')}catch(err){note(err.message)}finally{$('save').disabled=false}};
function editProduct(id){editing=products.find(p=>p.id===id);$('name').value=editing.name;$('price').value=editing.price;$('install').value=editing.install_price;$('description').value=editing.description||'';$('formTitle').textContent='تعديل المنتج';$('save').textContent='حفظ التعديلات';$('cancel').classList.remove('hidden')}
function reset(){editing=null;$('productForm').reset();$('formTitle').textContent='إضافة منتج';$('save').textContent='حفظ المنتج';$('cancel').classList.add('hidden')}
$('cancel').onclick=reset;
async function deleteProduct(id){if(!confirm('حذف المنتج؟'))return;let {error}=await db.from('products').delete().eq('id',id);if(error){note(error.message);return}await loadProducts()}
async function loadOrders(){let {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){$('orders').textContent=error.message;return}$('orders').innerHTML=(data||[]).map(o=>`<div class="order"><b>الزبون: ${esc(o.customer_name)}</b><p>الهاتف: ${esc(o.phone)} | العنوان: ${esc(o.address||'غير محدد')}</p><p>المنتجات: ${esc((o.items||[]).map(x=>x.name+' × '+x.quantity).join('، '))}</p><p>السلع ${money(o.goods_total)} — التركيب ${money(o.install_total)} — الإجمالي <b>${money(o.grand_total)}</b></p><div class="row"><select id="s-${o.id}"><option value="pending" ${o.status==='pending'?'selected':''}>قيد الانتظار</option><option value="confirmed" ${o.status==='confirmed'?'selected':''}>مؤكد</option><option value="completed" ${o.status==='completed'?'selected':''}>مكتمل</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>ملغى</option></select><button class="secondary" onclick="updateOrder('${o.id}')">تحديث الحالة</button>${o.status==='completed'?`<button type="button" class="danger" onclick="deleteOrder('${o.id}')">حذف الطلب المكتمل</button>`:''}</div></div>`).join('')||'لا توجد طلبات حالياً'}
async function updateOrder(id){let {error}=await db.from('orders').update({status:$('s-'+id).value}).eq('id',id);if(error){note(error.message);return}await loadOrders();note('تم تحديث حالة الطلب')}
async function deleteOrder(id){
  if(!confirm('هل أنت متأكد من حذف هذا الطلب نهائياً؟ لا يمكن التراجع عن الحذف.')) return;
  const {error}=await db.from('orders').delete().eq('id',id);
  if(error){
    note('تعذر حذف الطلب: '+error.message+' — قد تحتاج صلاحية DELETE في سياسات Supabase.');
    return;
  }
  await loadOrders();
  note('تم حذف الطلب بنجاح.');
}
// إتاحة الدالة لزر الحذف المولّد داخل قائمة الطلبات
window.deleteOrder = deleteOrder;
db.auth.getSession().then(({data})=>{if(data.session)openDash()}).catch(error=>note('تعذر استعادة جلسة المدير: '+(error.message||'أعد تحميل الصفحة.')));

})().catch(error=>{const target=document.getElementById('products')||document.getElementById('notice');if(target){target.textContent='تعذر تشغيل الموقع: '+(error.message||'تحقق من اتصال الإنترنت ثم أعد المحاولة.');target.style.display='block';}});
</script></body></html>
