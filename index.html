<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOAD BENHADJ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17212b;font-family:Tahoma,Arial}header{padding:55px 5%;color:white;background:linear-gradient(110deg,#101a25eF,#182b3bd9),url('https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=1500&q=80') center/cover}h1{font-size:clamp(2.3rem,6vw,4rem);margin:10px 0}main{max-width:1100px;margin:25px auto;padding:0 15px}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e0e6eb;border-radius:14px;overflow:hidden;padding:14px}.card{padding:0}.card img{width:100%;height:145px;object-fit:cover}.body{padding:14px}.line{display:flex;justify-content:space-between;margin:9px 0}button{border:0;border-radius:9px;padding:10px 14px;background:#d97706;color:white;font-weight:bold;cursor:pointer}.secondary{background:#e7edf2;color:#17212b}.qty{display:flex;gap:9px;align-items:center;margin-top:8px}.item{border-bottom:1px solid #e1e6eb;padding:10px 0}input,textarea{width:100%;padding:10px;border:1px solid #ccd5de;border-radius:8px;font:inherit;margin:5px 0 10px}.total{display:flex;justify-content:space-between;margin:10px 0}.grand{font-weight:bold;border-top:1px solid #ddd;padding-top:12px}.muted{color:#687582}.notice{padding:10px;background:#fff1d6;margin:10px 0;display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}}
</style></head><body><header><div>خدمات الترصيص الصحي</div><h1>FOAD BENHADJ</h1><p>اختر المنتجات واحسب سعر السلع والتركيب وأرسل طلبك.</p></header><main><h2>المنتجات والخدمات</h2><div id="notice" class="notice"></div><div class="layout"><section><div id="products" class="products">جارٍ تحميل المنتجات...</div></section><aside class="panel"><h2>🛒 السلة</h2><div id="cart" class="muted">السلة فارغة</div><div class="total"><span>مجموع السلع</span><b id="goods">0 دج</b></div><div class="total"><span>مجموع التركيب</span><b id="install">0 دج</b></div><div class="total grand"><span>الإجمالي</span><b id="grand">0 دج</b></div><h3>بيانات الزبون</h3><form id="order"><label>الاسم</label><input id="customer" required><label>رقم الهاتف</label><input id="phone" required type="tel"><label>العنوان (اختياري)</label><textarea id="address"></textarea><button style="width:100%">إرسال الطلب</button></form><p class="muted">سيتواصل معك صاحب المحل لتأكيد الطلب.</p></aside></div></main>
<script>
(async function bootstrapSite(){
  function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('تعذر تحميل ملف: '+src));document.head.appendChild(s);});}
  if(!window.supabase){try{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js');}catch(firstError){await loadScript('https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js');}}
  window.SUPABASE_URL = "https://pbhqyfkqmdbquuzvqtod.supabase.co";
  window.SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5OrQVUhsStQUxFKUC5e2vg_3fcwOq2z";

if (!window.supabase || !window.SUPABASE_URL || !window.SUPABASE_PUBLISHABLE_KEY) {
  document.getElementById('products').textContent =
    'تعذر تحميل إعدادات الموقع. حدّث الصفحة أو تواصل مع الإدارة.';
  throw new Error('Supabase library failed to load');
}
const db = window.supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_PUBLISHABLE_KEY
);let ps=[],cart={};const money=n=>Number(n||0).toLocaleString('fr-FR')+' دج';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(t){let e=document.getElementById('notice');e.textContent=t;e.style.display='block'}
async function load(){
  const productsBox = document.getElementById('products');
  productsBox.textContent = 'جارٍ تحميل المنتجات...';
  try {
    const {data,error} = await db.from('products').select('*').order('created_at',{ascending:false});
    if(error) throw error;
    ps = data || [];
    productsBox.innerHTML = ps.length
      ? ps.map(p=>`<article class="card"><img src="${esc(p.image_url||'')}" alt="${esc(p.name)}" onerror="this.style.display='none'"><div class="body"><h3>${esc(p.name)}</h3><div class="line"><span>سعر السلعة</span><b>${money(p.price)}</b></div><div class="line"><span>التركيب</span><b>${money(p.install_price)}</b></div><button onclick="add('${esc(p.id)}')">أضف للسلة</button></div></article>`).join('')
      : '<p>لا توجد منتجات حالياً.</p>';
    render();
  } catch(error) {
    productsBox.textContent = 'تعذر تحميل المنتجات: ' + (error.message || 'تحقق من اتصال الإنترنت.');
    note(error.message || 'تعذر الاتصال بقاعدة البيانات.');
  }
}
window.add = function(id) {
  id = String(id);
  cart[id] = (cart[id] || 0) + 1;
  render();
};

window.change = function(id, d) {
  id = String(id);
  cart[id] = Math.max(0, (cart[id] || 0) + d);
  if (!cart[id]) delete cart[id];
  render();
};

function render() {
  let entries = Object.entries(cart).filter(
    ([id, q]) => q && ps.some(p => String(p.id) === String(id))
  );

  let g = 0;
  let i = 0;

  document.getElementById('cart').innerHTML = entries.length
    ? entries.map(([id, q]) => {
        let p = ps.find(x => String(x.id) === String(id));

        let price = Number(p.price || 0);
        let installPrice = Number(p.install_price || 0);

        g += price * q;
        i += installPrice * q;

        return `
          <div class="item">
            <b>${esc(p.name)}</b>
            <div class="muted">
              سلع ${money(price * q)} — تركيب ${money(installPrice * q)}
            </div>
            <div class="qty">
              <button class="secondary" onclick="change('${esc(id)}',-1)">−</button>
              ${q}
              <button onclick="change('${esc(id)}',1)">＋</button>
            </div>
          </div>
        `;
      }).join('')
    : 'السلة فارغة';

  document.getElementById('goods').textContent = money(g);
  document.getElementById('install').textContent = money(i);
  document.getElementById('grand').textContent = money(g + i);
}
};

window.change = function(id, d) {
  id = String(id);
  cart[id] = Math.max(0, (cart[id] || 0) + d);
  if (!cart[id]) delete cart[id];
  render();
function render(){let entries=Object.entries(cart).filter(([id,q])=>q&&ps.some(p=>String(p.id)===String(id))))),g=0,i=0;document.getElementById('cart').innerHTML=entries.length?entries.map(([id,q])=>{let p=ps.find(x=>x.id===id);g+=p.price*q;i+=p.install_price*q;return `<div class="item"><b>${esc(p.name)}</b><div class="muted">سلع ${money(p.price*q)} — تركيب ${money(p.install_price*q)}</div><div class="qty"><button class="secondary" onclick="change('${id}',-1)">−</button>${q}<button onclick="change('${id}',1)">＋</button></div></div>`}).join(''):'السلة فارغة';document.getElementById('goods').textContent=money(g);document.getElementById('install').textContent=money(i);document.getElementById('grand').textContent=money(g+i)}
document.getElementById('order').onsubmit=async e=>{
  e.preventDefault();
  const customerName = document.getElementById('customer').value.trim();
  const customerPhone = document.getElementById('phone').value.trim();
  const customerAddress = document.getElementById('address').value.trim();
  const items = Object.entries(cart)
    .filter(([id,q])=>q && ps.some(p=>String(p.id)===String(id)))
    .map(([id,quantity])=>{
      const p=ps.find(x=>String(x.id)===String(id));
      return {product_id:id,name:p.name,quantity,unit_price:p.price,unit_install_price:p.install_price};
    });
  if(!items.length){note('أضف منتجاً إلى السلة أولاً.');return}
  const goods=items.reduce((s,x)=>s+x.unit_price*x.quantity,0);
  const install=items.reduce((s,x)=>s+x.unit_install_price*x.quantity,0);
  const submitButton=e.target.querySelector('button[type="submit"],button:not([type])');
  if(submitButton) submitButton.disabled=true;
  try {
    const {error}=await db.from('orders').insert({
      customer_name:customerName, phone:customerPhone, address:customerAddress,
      items, goods_total:goods, install_total:install, grand_total:goods+install
    });
    if(error) throw error;
    cart={}; render(); e.target.reset(); note('تم إرسال الطلب بنجاح.');
  } catch(error) {
    note('تعذر إرسال الطلب: ' + (error.message || 'تحقق من الاتصال وحاول مجدداً.'));
  } finally {
    if(submitButton) submitButton.disabled=false;
  }
};
load();

})().catch(error=>{const target=document.getElementById('products')||document.getElementById('notice');if(target){target.textContent='تعذر تشغيل الموقع: '+(error.message||'تحقق من اتصال الإنترنت ثم أعد المحاولة.');target.style.display='block';}});
</script></body></html>
